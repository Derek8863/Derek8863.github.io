<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#fbfaf7">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Derek 的博客首页">Derek<span>.</span></a>
      <nav aria-label="主导航">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>文章</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>关于</a>
        <a href="https://github.com/Derek8863" rel="me">GitHub</a>
      </nav>
    </header>
    <main id="content">{{ content }}</main>
    <footer class="site-footer">
      <span>© {{ site.time | date: '%Y' }} Derek</span>
      <span>写在这里，留给以后回看。</span>
    </footer>
  </div>
</body>
</html>
