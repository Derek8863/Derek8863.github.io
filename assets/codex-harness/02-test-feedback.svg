<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="title desc">
<title id="title">同一组测试，让修复前后的行为可以比较</title>
<desc id="desc">修复前缺少 user_id 返回 500，测试失败；改为返回 400 后，两项测试通过。失败进入上下文，模型提出修改，工具修改文件，再运行测试。调用顺序是教学示意，测试结果来自实际运行。</desc>
<defs><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#287b79"/></marker></defs>
<rect width="900" height="530" rx="20" fill="#f2f7f7"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#1c333a">
<text x="36" y="48" font-size="24" font-weight="700">同一组测试，让修复前后的行为可以比较</text>
<text x="36" y="79" font-size="16" fill="#576e73">只验证两种输入下的状态码 · 不代表整个服务已验证</text>
<rect x="36" y="110" width="360" height="256" rx="14" fill="#fff" stroke="#dec4c0"/>
<rect x="504" y="110" width="360" height="256" rx="14" fill="#fff" stroke="#b8d1d1"/>
<g font-size="22" font-weight="700"><text x="60" y="151">修复前</text><text x="528" y="151">修复后</text></g>
<g font-size="18"><text x="60" y="196">缺少 user_id → 返回 500</text><text x="528" y="196">缺少 user_id → 返回 400</text><text x="60" y="232">携带 user_id → 返回 200</text><text x="528" y="232">携带 user_id → 返回 200</text></g>
<rect x="58" y="258" width="316" height="82" rx="10" fill="#fbefeb"/><rect x="526" y="258" width="316" height="82" rx="10" fill="#e8f3ed"/>
<g font-size="19" font-weight="700"><text x="76" y="289" fill="#9a4235">FAIL · expected 400, got 500</text><text x="544" y="289" fill="#25664c">PASS · 两项测试通过</text></g>
<g font-size="17" fill="#576e73"><text x="76" y="319">命令退出码：1</text><text x="544" y="319">命令退出码：0</text></g>
<path d="M408 219H491" stroke="#287b79" stroke-width="2.5" marker-end="url(#arrow2)"/><text x="450" y="205" font-size="17" text-anchor="middle">修改</text>
<rect x="36" y="390" width="828" height="73" rx="12" fill="#dfeded"/>
<g font-size="18" text-anchor="middle"><text x="136" y="433">失败进入上下文</text><text x="350" y="433">模型提出修改</text><text x="557" y="433">工具修改文件</text><text x="766" y="433">再次运行测试</text></g>
<g stroke="#287b79" stroke-width="2" marker-end="url(#arrow2)"><path d="M218 426H262"/><path d="M421 426H471"/><path d="M630 426H678"/></g>
<text x="36" y="501" font-size="16" fill="#576e73">修复流程为教学示意；Go handler 测试已实际运行。</text>
</g></svg>
