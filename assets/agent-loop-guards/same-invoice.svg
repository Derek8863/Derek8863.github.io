<svg xmlns="http://www.w3.org/2000/svg" width="860" height="600" viewBox="0 0 860 600" role="img" aria-labelledby="title"><title id="title">三个写法，同一张发票</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617e78"/></marker></defs><rect width="860" height="600" rx="24" fill="#f1f4ed"/><g font-family="'Microsoft YaHei','PingFang SC',sans-serif"><text x="38" y="53" font-size="30" fill="#233b39" font-weight="700">三个写法，同一张发票</text><text x="38" y="88" font-size="19" fill="#61716b" font-weight="400">前提：接口按 trim + 大写解析编号；客户始终是 C-17</text><rect x="35" y="130" width="238" height="62" rx="16" fill="#fff" stroke="#d2ddd6"/><text x="55" y="169" font-size="23" fill="#233b39" font-weight="400">"INV-2291"</text><rect x="35" y="218" width="238" height="62" rx="16" fill="#fff" stroke="#d2ddd6"/><text x="55" y="257" font-size="23" fill="#233b39" font-weight="400">"inv-2291"</text><rect x="35" y="306" width="238" height="62" rx="16" fill="#fff" stroke="#d2ddd6"/><text x="55" y="345" font-size="23" fill="#233b39" font-weight="400">" INV-2291 "</text><path d="M273 161 H312 V248 H340" fill="none" stroke="#617e78" stroke-width="3"  marker-end="url(#arrow)"/><path d="M273 249 H340" fill="none" stroke="#617e78" stroke-width="3"  marker-end="url(#arrow)"/><path d="M273 337 H312 V248 H340" fill="none" stroke="#617e78" stroke-width="3"  marker-end="url(#arrow)"/><rect x="350" y="188" width="193" height="122" rx="16" fill="#fff4df" stroke="#ddcba4"/><text x="375" y="230" font-size="24" fill="#805c21" font-weight="600">参数归一化</text><text x="377" y="267" font-size="20" fill="#805c21" font-weight="400">去空格 · 大写</text><path d="M543 249 H587" fill="none" stroke="#617e78" stroke-width="3"  marker-end="url(#arrow)"/><rect x="597" y="188" width="228" height="122" rx="16" fill="#deeee5" stroke="#9fbead"/><text x="623" y="228" font-size="23" fill="#285d49" font-weight="600">同一调用标识</text><text x="619" y="265" font-size="21" fill="#285d49" font-weight="400">C-17 / INV-2291</text><text x="596" y="348" font-size="21" fill="#285d49" font-weight="600">重复计数继续累加</text><line x1="36" y1="405" x2="824" y2="405" stroke="#cbd5cd"/><text x="38" y="448" font-size="22" fill="#233b39" font-weight="600">真正换一张发票</text><rect x="35" y="474" width="238" height="62" rx="16" fill="#fff" stroke="#d2ddd6"/><text x="55" y="513" font-size="23" fill="#233b39" font-weight="400">"INV-2292"</text><path d="M273 505 H587" fill="none" stroke="#617e78" stroke-width="3"  marker-end="url(#arrow)"/><rect x="597" y="474" width="228" height="62" rx="16" fill="#fff" stroke="#d2ddd6"/><text x="619" y="513" font-size="21" fill="#233b39" font-weight="400">C-17 / INV-2292</text><text x="320" y="493" font-size="20" fill="#61716b" font-weight="400">归一化后仍不同</text><text x="38" y="574" font-size="18" fill="#61716b" font-weight="400">保留客户编号；不要擅自删除可能有业务含义的前缀或数字。</text></g></svg>
