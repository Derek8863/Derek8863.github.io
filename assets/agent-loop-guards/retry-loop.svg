<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title"><title id="title">失败怎样变成下一次尝试</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617e78"/></marker></defs><rect width="860" height="480" rx="24" fill="#f1f4ed"/><g font-family="'Microsoft YaHei','PingFang SC',sans-serif"><text x="38" y="53" font-size="30" fill="#233b39" font-weight="700">失败怎样变成下一次尝试</text><text x="38" y="88" font-size="19" fill="#61716b" font-weight="400">教学场景：发票服务持续不可用</text><rect x="45" y="145" width="200" height="92" rx="16" fill="#fff" stroke="#d2ddd6"/><text x="70" y="182" font-size="23" fill="#233b39" font-weight="600">模型发起查询</text><text x="70" y="215" font-size="20" fill="#61716b" font-weight="400">INV-2291</text><rect x="330" y="145" width="200" height="92" rx="16" fill="#fff4df" stroke="#ddcba4"/><text x="361" y="182" font-size="23" fill="#805c21" font-weight="600">框架检查</text><text x="356" y="215" font-size="20" fill="#805c21" font-weight="400">是否继续执行？</text><rect x="615" y="145" width="200" height="92" rx="16" fill="#fff" stroke="#d2ddd6"/><text x="650" y="182" font-size="23" fill="#233b39" font-weight="600">发票接口</text><text x="662" y="215" font-size="20" fill="#a34b38" font-weight="400">返回超时</text><path d="M245 190 H320" fill="none" stroke="#617e78" stroke-width="3"  marker-end="url(#arrow)"/><path d="M530 190 H605" fill="none" stroke="#617e78" stroke-width="3"  marker-end="url(#arrow)"/><path d="M715 237 V305 H145 V247" fill="none" stroke="#617e78" stroke-width="3"  marker-end="url(#arrow)"/><rect x="281" y="282" width="298" height="46" rx="0" fill="#f1f4ed" stroke="#f1f4ed"/><text x="298" y="313" font-size="20" fill="#233b39" font-weight="400">错误回到上下文，再次尝试</text><path d="M430 237 V356" fill="none" stroke="#a34b38" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="280" y="366" width="300" height="69" rx="16" fill="#f8e4dd" stroke="#d4a18c"/><text x="321" y="409" font-size="23" fill="#8c4834" font-weight="600">拦截调用 / 结束任务</text><text x="600" y="410" font-size="18" fill="#61716b" font-weight="400">不再访问发票接口</text></g></svg>
