<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="title"><title id="title">单任务预算，管不到所有任务的总账</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617e78"/></marker></defs><rect width="860" height="420" rx="24" fill="#f1f4ed"/><g font-family="'Microsoft YaHei','PingFang SC',sans-serif"><text x="38" y="53" font-size="28" fill="#233b39" font-weight="700">单任务预算，管不到所有任务的总账</text><text x="38" y="88" font-size="19" fill="#61716b" font-weight="400">以下为演示金额，不是实测账单</text><rect x="38" y="126" width="240" height="165" rx="16" fill="#fff" stroke="#d2ddd6"/><text x="62" y="164" font-size="23" fill="#233b39" font-weight="600">单个任务</text><text x="62" y="218" font-size="43" fill="#285d49" font-weight="700">$0.08</text><text x="62" y="263" font-size="19" fill="#61716b" font-weight="400">低于 $0.10 阈值</text><rect x="310" y="126" width="240" height="165" rx="16" fill="#fff" stroke="#d2ddd6"/><text x="334" y="164" font-size="23" fill="#233b39" font-weight="600">1,000 个任务</text><text x="334" y="218" font-size="43" fill="#a34b38" font-weight="700">$80</text><text x="334" y="263" font-size="18" fill="#61716b" font-weight="400">假设全部执行的合计</text><rect x="582" y="126" width="240" height="165" rx="16" fill="#deeee5" stroke="#9fbead"/><text x="606" y="164" font-size="22" fill="#233b39" font-weight="600">共享服务端额度</text><text x="606" y="218" font-size="35" fill="#285d49" font-weight="700">$20 / 天</text><text x="606" y="263" font-size="18" fill="#61716b" font-weight="400">额度不足，拒绝新请求</text><text x="39" y="341" font-size="23" fill="#233b39" font-weight="600">第三层限制每次运行；第四层限制多个运行的累计消费。</text><text x="39" y="383" font-size="19" fill="#61716b" font-weight="400">服务端拒绝后续请求，不等于撤销已经发出的在途请求。</text></g></svg>
